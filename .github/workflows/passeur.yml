# Remplace l'ancienne adresse (https://django184.github.io/minuterie/) par le passeur :
# page qui transmet les données de l'appareil à https://ma-journee-2q9.pages.dev et service worker
# qui désinstalle l'ancienne app (ECOSYSTEME.md §7.4, chantier B, étape 3).
# Lancement manuel uniquement, après vérification de la nouvelle adresse sur le téléphone.
# Settings → Pages → Source : « GitHub Actions » (déjà le cas).
name: Passeur de l'ancienne adresse

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Écrire « passeur » pour remplacer l'app de l'ancienne adresse"
        required: true

permissions:
  contents: read

jobs:
  tests:
    if: inputs.confirmation == 'passeur'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Changement d'adresse de bout en bout
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
          node tests/demenagement.mjs

  passeur:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: passeur
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Résumé
        run: echo "## ✅ Ancienne adresse remplacée par le passeur vers https://ma-journee-2q9.pages.dev/" >> "$GITHUB_STEP_SUMMARY"
