<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Ma journée</title>
<meta name="theme-color" content="#F7F6F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141114" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ma journée">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preload" href="fonts/IBMPlexSans-Regular-Latin1.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/socle.css">
<link rel="stylesheet" href="css/app.css">
<script src="js/app.js" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="date" id="date"></div>
      <h1>Ma journée</h1>
    </div>
    <div>
      <div class="summary">
        <span class="big"><span id="sumDone">0h00</span> <small>/ <span id="sumPlan">0h00</span></small></span>
        <span class="count"><b id="sumCount">0/0</b> terminées</span>
      </div>
      <div class="track sum"><span id="sumBar"></span></div>
    </div>
  </header>

  <div class="update" id="update" role="region" aria-label="Mise à jour" hidden>
    <p>Une nouvelle version est disponible.</p>
    <span class="actions">
      <button type="button" class="later" id="update-later">Plus tard</button>
      <button type="button" class="pill" id="update-reload">Recharger</button>
    </span>
  </div>

  <div class="mode" id="mode" hidden></div>

  <div class="list" id="list"></div>

  <footer id="footer"></footer>
</div>
<div class="sr-only" id="announce" role="status" aria-live="polite"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>
</body>
</html>
